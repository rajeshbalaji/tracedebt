[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tracedebt"
version = "0.2.0"
description = "Runtime-guided detection of architectural drift in microservices, from distributed traces"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
tracedebt = "tracedebt.cli:main"

[tool.setuptools]
packages = ["tracedebt"]
